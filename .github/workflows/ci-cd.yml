name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # 1. BUILD & TEST JOB
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Byte Compile Check
        run: python -m compileall -q .

      - name: Run Tests
        run: pytest -q

      - name: Create Release Package
        run: |
          mkdir -p dist
          tar -czvf dist/flappy_bird_app.tar.gz --exclude='.git' --exclude='dist' .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-build
          path: dist/

  # 2. AUTOMATED DEPLOYMENT TO AWS EC2
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flappy-bird-build
          path: dist/

      - name: Copy Package to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/flappy_bird_app.tar.gz"
          target: "~/app_deployments/"
          strip_components: 1

      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Set up deployment directory
            mkdir -p ~/flappy_bird_app
            
            # Extract new release package
            tar -xzvf ~/app_deployments/flappy_bird_app.tar.gz -C ~/flappy_bird_app/
            
            # Navigate to directory and install/update dependencies
            cd ~/flappy_bird_app
            pip install -r requirements.txt
            
            # Remove uploaded archive from temp location
            rm ~/app_deployments/flappy_bird_app.tar.gz

            echo "Deployment completed successfully on EC2!"

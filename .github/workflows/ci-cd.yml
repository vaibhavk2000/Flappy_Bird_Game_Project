name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # 1. BUILD & TEST JOB
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Byte Compile Check
        run: python -m compileall -q .

      - name: Run Tests
        run: pytest -q

      - name: Create Release Package
        run: |
          mkdir -p dist
          tar -czvf dist/flappy_bird_app.tar.gz --exclude='.git' --exclude='dist' .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-build
          path: dist/

  # 2. DEPLOY JOB (Runs only on push to main/master after tests pass)
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flappy-bird-build
          path: dist/

      - name: Deploy Step
        run: |
          echo "Executing deployment commands here..."
          # Insert your target-specific deployment script/tool here:
          # e.g., GitHub Pages, AWS S3 / EC2, Docker Registry, Server SSH commands
